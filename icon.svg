  <circle cx="16" cy="39" r="1.8" fill="#eaf1f8"/>
  <circle cx="32" cy="39" r="1.8" fill="#eaf1f8"/>
  <circle cx="48" cy="39" r="1.8" fill="#eaf1f8"/>
  <!-- attribute lines -->
  <path d="M12 45v6M20 45v6M28 45v6M36 45v6M44 45v6M52 45v6" stroke="#93a7bb" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M26 55h12" stroke="#2f5f8f" stroke-width="2.4" stroke-linecap="round"/>
